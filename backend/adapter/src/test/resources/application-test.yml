server:
  port: 0
spring:
  task:
    scheduling:
      enabled: false
  datasource:
    url: jdbc:h2:mem:audit_it;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      continue-on-error: false
audit:
  tos:
    local-dir: ${java.io.tmpdir}/audit-tos-it
